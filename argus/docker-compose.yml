services:
  argus:
    build: .
    image: ghcr.io/bmgalhardo/argus:0.2.0
    env_file:
      - path: .env
      - path: ../athena/secrets/argus.env
        required: false
    environment:
      CONTEXT_DIR: /context
      CA_FILE: /ca/root-ca.crt
    volumes:
      - ../.claude/context:/context:ro
      - ../infra/ca/root-ca.crt:/ca/root-ca.crt:ro
      - /etc/localtime:/etc/localtime:ro
