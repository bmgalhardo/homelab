[project]
name = "argus"
version = "0.2.0"
description = "Daily homelab report agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.scripts]
argus = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
