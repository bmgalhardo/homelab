modules:
  # Internal services, certs issued by the internal root CA. Auth redirects and
  # login walls count as up.
  https_internal:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403]
      tls_config:
        ca_file: /etc/blackbox/ca.crt

  https_public:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403]

  # Vault: 200 only when initialised, unsealed and active.
  vault_health:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      tls_config:
        ca_file: /etc/blackbox/ca.crt

  # Proxmox serves its own self-signed cert through the Hermes passthrough.
  https_selfsigned:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      tls_config:
        insecure_skip_verify: true

  dns_internal:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: vault.bgalhardo.internal
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_not_matches_regexp: [".*\t192\\.168\\.1\\.173$"]

  dns_upstream:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: cloudflare.com
      query_type: A
      valid_rcodes: [NOERROR]
