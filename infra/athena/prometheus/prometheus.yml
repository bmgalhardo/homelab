# athena — Prometheus. Metrics companion to Loki. Small by design:
# 30d / 5GB retention, local TSDB. Scrapes the local stack; elysium pushes via
# remote_write (kubernetes/10-infra-base/monitoring.yaml).

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: athena

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["grafana:3000"]

  # ── stubs — enable as the sources come online (argus.md Phase 2+) ──────────
