# athena — Prometheus. Metrics companion to Loki. Small by design:
# 30d / 5GB retention, local TSDB. Scrapes the local stack; elysium pushes via
# remote_write (kubernetes/10-infra-base/monitoring.yaml).

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: athena

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: { instance: athena }
      - targets: ["192.168.1.199:9100"]
        labels: { instance: hermes }
      - targets: ["192.168.1.197:9100"]
        labels: { instance: apollo }
      - targets: ["192.168.1.198:9100"]
        labels: { instance: hades }

  - job_name: haproxy
    static_configs:
      - targets: ["192.168.1.199:8405"]
        labels: { instance: hermes }

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  - job_name: probe_https_internal
    metrics_path: /probe
    params: { module: [https_internal] }
    static_configs:
      - targets:
          - https://athena.bgalhardo.internal:3000/api/health
          - https://authentik.bgalhardo.internal/-/health/live/
          - https://omni.bgalhardo.internal
          - https://homepage.bgalhardo.internal
          - https://litellm.bgalhardo.internal/health/liveliness
          - https://openwebui.bgalhardo.internal/health
          - https://pgadmin.bgalhardo.internal
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: probe_https_public
    metrics_path: /probe
    params: { module: [https_public] }
    static_configs:
      - targets:
          - https://couchdb.bgalhardo.com
          - https://immich.bgalhardo.com
    relabel_configs: *probe_relabel

  - job_name: probe_vault
    metrics_path: /probe
    params: { module: [vault_health] }
    static_configs:
      - targets: ["https://vault.bgalhardo.internal/v1/sys/health"]
    relabel_configs: *probe_relabel

  - job_name: probe_proxmox
    metrics_path: /probe
    params: { module: [https_selfsigned] }
    static_configs:
      - targets:
          - https://proxmox.bgalhardo.internal
          - https://192.168.1.197:8006
          - https://192.168.1.198:8006
    relabel_configs: *probe_relabel

  - job_name: probe_dns
    metrics_path: /probe
    params: { module: [dns_internal] }
    static_configs:
      - targets: ["192.168.1.199"]
    relabel_configs: *probe_relabel

  - job_name: probe_dns_upstream
    metrics_path: /probe
    params: { module: [dns_upstream] }
    static_configs:
      - targets: ["192.168.1.199"]
    relabel_configs: *probe_relabel

