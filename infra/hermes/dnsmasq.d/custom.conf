# Hermes — dnsmasq site config. Loaded via conf-dir in the stock
# /etc/dnsmasq.conf (which is otherwise untouched).
#
# Deploy: scp to /etc/dnsmasq.d/custom.conf on hermes (192.168.1.199),
#         chmod 644, `rc-service dnsmasq restart`, then `lbu commit`.
#
# DNS only — DHCP / fixed-IP reservations live on the UDM Pro.

# no DHCP here
no-dhcp-interface=

# don't read /etc/resolv.conf; use the servers below
no-resolv
server=1.1.1.1
server=8.8.8.8

# ── wildcards: anything not matched below → k8s ingress ────────────────
address=/.bgalhardo.internal/192.168.1.200
address=/.bgalhardo.com/192.168.1.201

# ── physical nodes (override the wildcard; longest-match wins) ────────
address=/athena.bgalhardo.internal/192.168.1.196
address=/apollo.bgalhardo.internal/192.168.1.197
address=/hades.bgalhardo.internal/192.168.1.198
address=/hermes.bgalhardo.internal/192.168.1.199

# ── via HAProxy on this box (see haproxy.cfg) ─────────────────────────
address=/proxmox.bgalhardo.internal/192.168.1.199
address=/authentik.bgalhardo.internal/192.168.1.199

# ── gateway ──────────────────────────────────────────────────────────
address=/unifi.bgalhardo.internal/192.168.1.1

# ── Olympus VMs (Apollo) — direct ────────────────────────────────────
address=/omni.bgalhardo.internal/192.168.1.171
address=/vault.bgalhardo.internal/192.168.1.173
address=/postgres.bgalhardo.internal/192.168.1.177

# ── NAS ──────────────────────────────────────────────────────────────
address=/truenas.bgalhardo.internal/192.168.1.190

cache-size=1000

# Debug only — leaves an unbounded file in the tmpfs overlay on a 512 MB
# Pi 1; do not enable except while actively debugging.
#log-queries
#log-facility=/var/log/dnsmasq.log
