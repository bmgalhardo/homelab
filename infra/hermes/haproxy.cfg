#---------------------------------------------------------------------
# Hermes — HAProxy. TLS-SNI router in front of the homelab.
#
# Deploy: scp to /etc/haproxy/haproxy.cfg on hermes (192.168.1.199),
#         `rc-service haproxy restart`, then `lbu commit`.
#
# Needs /etc/haproxy/certs/authentik.bgalhardo.internal.pem
# (leaf + key concatenated, PEM). Issue from Vault pki_infra — see README.
#---------------------------------------------------------------------

global
    log         192.168.1.196:1515 local2 info
    log-send-hostname hermes
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option http-server-close
    option forwardfor       except 127.0.0.0/8
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           10s
    maxconn                 3000

# -------------------------------
# FRONTEND: TCP (TLS passthrough / SNI routing)
# -------------------------------
frontend https_frontend
	bind *:443
	mode tcp
	option tcplog

	tcp-request inspect-delay 5s
	tcp-request content accept if { req.ssl_hello_type 1 }

	acl is_proxmox req.ssl_sni -i proxmox.bgalhardo.internal
	use_backend proxmox_backend if is_proxmox

	default_backend https_termination

frontend https_termination_listener
	bind 127.0.0.1:8443 ssl crt /etc/haproxy/certs/ accept-proxy
	mode http

	acl is_authentik hdr(host) -i authentik.bgalhardo.internal
	use_backend authentik_backend if is_authentik

frontend prometheus
	bind *:8405
	mode http
	no log
	http-request use-service prometheus-exporter if { path /metrics }

# -------------------------------
# BACKENDS
# -------------------------------
backend proxmox_backend
	mode tcp
	server apollo 192.168.1.197:8006 check
	server hades 192.168.1.198:8006 check backup

backend authentik_backend
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	http-request set-header Host %[req.hdr(Host)]
	http-request set-header Connection upgrade if { req.hdr(Upgrade) -i websocket }
	http-request set-header Upgrade %[req.hdr(Upgrade)] if { req.hdr(Upgrade) -i websocket }
	server authentik 192.168.1.174:80 check

backend https_termination
	mode tcp
	server local_termination 127.0.0.1:8443 send-proxy-v2
