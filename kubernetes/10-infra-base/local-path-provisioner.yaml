# Patch over the upstream local-path-storage manifest:
#  - point volumes at the Talos `local-path` user volume (/var/mnt/local-path)
#  - pin the deployment to a real node (it must run where PVs are provisioned;
#    both workers have the volume, but keep it simple on apollo)
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
      "nodePathMap": [
        { "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/var/mnt/local-path"] }
      ]
    }
