apiVersion: v1
kind: Namespace
metadata:
  name: vault-secrets-operator
---
# Token-reviewer identity for Vault's kubernetes auth method.
#
# Vault runs as a Docker container on Apollo, outside this cluster, so it
# has no in-pod service account to validate login tokens with. Its
# auth/kubernetes/config MUST carry an explicit token_reviewer_jwt taken
# from this SA -- dropping it is what silently broke every VSO secret and
# the cert-manager vault Issuer from 2025-12-12 to 2026-08-21.
#
# infra/olympus/services/vault/bootstrap-k8s-auth.sh reads the JWT out of
# the Secret below, so these must exist before that script is run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: vault-secrets-operator
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-auth
  namespace: vault-secrets-operator
  annotations:
    kubernetes.io/service-account.name: vault-auth
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: role-tokenreview-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: vault-secrets-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-secrets-operator
  namespace: vault-secrets-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: vault-secrets-operator
      version: "1.5.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    defaultVaultConnection:
      enabled: true
      address: https://vault.bgalhardo.internal
      caCertSecret: vault-ca      # created by infra/olympus/services/vault/bootstrap-k8s-auth.sh
    # The chart's defaultAuthMethod is unusable: its VaultAuth template renders
    # `namespace: {{ .Values.defaultAuthMethod.namespace }}` unquoted, and the
    # chart's own default for that value is "" — which becomes YAML null, while
    # the CRD requires a string. Install fails with:
    #   VaultAuth "default" is invalid: spec.namespace ... must be of type string
    # Setting namespace: "" in values renders the same null, and 1.4.1 has the
    # identical template, so there is no version to move to. The VaultAuth is
    # therefore declared by hand in 20-infra-wiring/vault-auth.yaml (tier 2,
    # because its CRD is installed here in tier 1).
    defaultAuthMethod:
      enabled: false
    controller:
      manager:
        logging:
          level: info
    tests:
      enabled: false
