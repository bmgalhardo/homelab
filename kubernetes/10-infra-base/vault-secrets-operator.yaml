apiVersion: v1
kind: Namespace
metadata:
  name: vault-secrets-operator
---
# Token reviewer for Vault's kubernetes auth; read by infra/vault/k8s-auth-bootstrap.sh
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: vault-secrets-operator
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-auth
  namespace: vault-secrets-operator
  annotations:
    kubernetes.io/service-account.name: vault-auth
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: role-tokenreview-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: vault-secrets-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-secrets-operator
  namespace: vault-secrets-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: vault-secrets-operator
      version: "1.5.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    defaultVaultConnection:
      enabled: false   # declared in 20-infra-wiring/vso-config.yaml
    defaultAuthMethod:
      enabled: false   # declared in 20-infra-wiring/vso-config.yaml
    controller:
      manager:
        logging:
          level: info
    tests:
      enabled: false
