# LoadBalancer IP pool (.200-.210), unchanged from the old MetalLB config.
# .200 = internal gateway (dnsmasq `*.bgalhardo.internal` wildcard target)
# .201 = external gateway (dnsmasq `*.bgalhardo.com` wildcard target)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.200-192.168.1.210
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
    - default
  nodeSelectors:
    - matchExpressions:
        - key: homelab/node
          operator: In
          values: [apollo]   # announce from the always-on node only
