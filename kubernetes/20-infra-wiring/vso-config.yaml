apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: vault-secrets-operator
spec:
  address: https://vault.bgalhardo.internal
  caCertSecretRef: vault-ca   # created by infra/vault/k8s-auth-bootstrap.sh, not by VSO
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: vault-secrets-operator
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vault-secrets-operator   # Vault role from infra/vault/k8s-auth-bootstrap.sh
    serviceAccount: default
  allowedNamespaces:
    - "*"
