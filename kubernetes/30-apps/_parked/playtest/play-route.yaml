# PARKED: the public play host for friends' playtests. Not in any
# kustomization. See README.md in this folder to unpark.
#
# play.bgalhardo.com on the external Gateway (Let's Encrypt, so friends need
# no CA import). It exposes only what a player needs:
#   - GET/HEAD under each game's build folder, served by publish
#   - POST /telemetry/push, forwarded to Loki on athena
# Everything else is a 404: no docs, mocks or project menus, and no WebDAV
# writes (PUT/DELETE/MOVE never match).
#
# Backends: publish (system/publish.yaml) and loki-athena
# (system/telemetry.yaml), both in the system namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: play
  namespace: system
spec:
  hostnames:
  - play.bgalhardo.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    sectionName: https
    namespace: system
  rules:
  # One match per game and method; matches in a rule are ORed. Add a game by
  # adding its two entries.
  - matches:
    - path: { type: PathPrefix, value: /02-prototype/game/ }
      method: GET
    - path: { type: PathPrefix, value: /02-prototype/game/ }
      method: HEAD
    - path: { type: PathPrefix, value: /03-prototype/game/ }
      method: GET
    - path: { type: PathPrefix, value: /03-prototype/game/ }
      method: HEAD
    backendRefs:
    - name: publish
      port: 8080
  - matches:
    - path:
        type: Exact
        value: /telemetry/push
      method: POST
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /loki/api/v1/push
    backendRefs:
    - name: loki-athena
      port: 3100
---
# The push endpoint is public: cap the body. A push is a few KB.
# Note: this also caps GET bodies on the route, which have none.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: play
  namespace: system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: play
  body:
    maxSize: 1m
