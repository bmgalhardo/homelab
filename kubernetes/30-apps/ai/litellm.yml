apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: llama-mini
        litellm_params:
          model: ollama_chat/llama3.2:1b
          api_base: http://ollama.ai.svc.cluster.local:11434
      - model_name: nomic-embed-text
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://ollama.ai.svc.cluster.local:11434
      - model_name: qwen-gpu
        litellm_params:
          model: ollama_chat/qwen2.5:1.5b
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
    litellm_settings:
      fallbacks: [{ "qwen-gpu": ["llama-mini"] }]
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:v1.102.1
        imagePullPolicy: IfNotPresent
        args: ["--config", "/app/config.yaml", "--port", "4000"]
        ports:
        - containerPort: 4000
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: master_key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: database_url
        volumeMounts:
        - mountPath: /app/config.yaml
          name: litellm-config
          subPath: config.yaml
      volumes:
      - name: litellm-config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: ai
spec:
  hostnames:
  - litellm.bgalhardo.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    sectionName: https
    namespace: system
  rules:
  - backendRefs:
    - name: litellm
      port: 4000
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: litellm-secrets
  namespace: ai
spec:
  type: kv-v2
  mount: kv
  path: apps/litellm
  destination:
    name: litellm-secrets
    create: true
  refreshAfter: 30s
