apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gpu
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-gpu
  template:
    metadata:
      labels:
        app: ollama-gpu
    spec:
      runtimeClassName: nvidia
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "3"
            memory: 5Gi
            nvidia.com/gpu: 1
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                until ollama list >/dev/null 2>&1; do sleep 2; done
                ollama pull qwen2.5:1.5b
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-models
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-gpu-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-gpu-models
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-gpu
  namespace: ai
spec:
  selector:
    app: ollama-gpu
  ports:
    - port: 11434
