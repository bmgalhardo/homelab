apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                until ollama list >/dev/null 2>&1; do sleep 2; done
                ollama pull llama3.2:1b
                ollama pull nomic-embed-text
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-models
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models
---
# Was an emptyDir — which is what filled the disk. emptyDir lives on the node's
# EPHEMERAL volume, capped at 12GB by infra/elysium/omni/patches/local-path.yaml,
# and the postStart hook above re-pulls both models on EVERY pod start. Once
# that volume fills, the kubelet reports DiskPressure and evicts pods node-wide,
# not just these.
#
# On the local-path user volume instead: models survive restarts (so the pulls
# become no-ops), and because it is a separate filesystem from EPHEMERAL,
# filling it fails ollama's writes rather than taking the node down with it.
#
# Note local-path does NOT enforce this size — it provisions a plain directory,
# so the request documents intent. The real ceiling is the Talos `local-path`
# user volume on the node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
