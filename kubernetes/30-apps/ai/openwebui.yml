apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
      - name: openwebui
        image: ghcr.io/open-webui/open-webui:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: OPENAI_API_BASE_URL
          value: http://litellm.ai.svc.cluster.local:4000/v1
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: master_key
        - name: WEBUI_AUTH
          value: "true"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: openwebui-secrets
              key: database_url
        - name: VECTOR_DB
          value: pgvector
        - name: PGVECTOR_DB_URL
          valueFrom:
            secretKeyRef:
              name: openwebui-secrets
              key: database_url
        - name: RAG_EMBEDDING_ENGINE
          value: openai
        - name: RAG_OPENAI_API_BASE_URL
          value: http://litellm.ai.svc.cluster.local:4000/v1
        - name: RAG_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: master_key
        - name: RAG_EMBEDDING_MODEL
          value: nomic-embed-text
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: ai
spec:
  selector:
    app: openwebui
  ports:
    - port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui
  namespace: ai
spec:
  hostnames:
  - openwebui.bgalhardo.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    sectionName: https
    namespace: system
  rules:
  - backendRefs:
    - name: openwebui
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openwebui-secrets
  namespace: ai
spec:
  type: kv-v2
  mount: kv
  path: apps/openwebui
  destination:
    name: openwebui-secrets
    create: true
  refreshAfter: 30s
