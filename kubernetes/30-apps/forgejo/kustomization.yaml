apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo

resources:
  - namespace.yaml
  - forgejo.yaml
  - backup.yaml

patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { homelab/node: apollo }
  - target: { kind: CronJob }
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/nodeSelector
        value: { homelab/node: apollo }
