default_config:

homeassistant:
  packages: !include_dir_named packages

automation: !include automations.yaml

lovelace:
  dashboards:
    dashboard-homelab:
      mode: yaml
      filename: dashboards/homelab.yaml
      title: Homelab
      icon: mdi:server
      show_in_sidebar: true

tts:
  - platform: google_translate

recorder:
  db_url: !env_var HA_RECORDER_DB_URL

prometheus:
  namespace: hass
