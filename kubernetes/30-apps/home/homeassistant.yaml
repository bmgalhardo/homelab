apiVersion: v1
kind: Namespace
metadata:
  name: home
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: home
spec:
  selector:
    app: homeassistant
  ports:
  - name: http
    port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant
  namespace: home
spec:
  hostnames:
  - home.bgalhardo.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    sectionName: https
    namespace: system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: homeassistant
      port: 8123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      containers:
      - name: homeassistant
        image: ghcr.io/home-assistant/home-assistant:2026.9.1
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Europe/Lisbon
        - name: HA_RECORDER_DB_URL
          valueFrom:
            secretKeyRef:
              name: homeassistant-secrets
              key: recorder_db_url
        ports:
        - name: http
          containerPort: 8123
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /config/configuration.yaml
          name: configuration
          subPath: configuration.yaml
        - mountPath: /config/packages
          name: packages
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: homeassistant-config
      - name: configuration
        configMap:
          name: homeassistant-configuration
      - name: packages
        configMap:
          name: homeassistant-packages
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homeassistant-secrets
  namespace: home
spec:
  type: kv-v2
  mount: kv
  path: apps/homeassistant
  destination:
    name: homeassistant-secrets
    create: true
  refreshAfter: 30s
