apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home

resources:
  - homeassistant.yaml
  - mosquitto.yaml

configMapGenerator:
  - name: homeassistant-configuration
    files:
      - config/configuration.yaml
  - name: homeassistant-packages
    files:
      - config/packages/mqtt_devices.yaml

patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { homelab/node: apollo }
