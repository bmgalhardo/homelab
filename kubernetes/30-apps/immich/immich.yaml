apiVersion: v1
kind: Namespace
metadata:
  name: immich
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
  - name: http
    port: 2283
---
apiVersion: v1
kind: Service
metadata:
  name: immich-ml
  namespace: immich
spec:
  selector:
    app: immich-ml
  ports:
  - name: http
    port: 3003
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-server
  namespace: immich
spec:
  hostnames:
  - immich.bgalhardo.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    sectionName: https
    namespace: system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: immich-server
      port: 2283
---
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata: 
  name: immich-client-settings
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: immich-server
  body:
    maxSize: 50g
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library
  namespace: immich
spec:
  volumeName: immich
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 250Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
      - name: immich-server
        env:
        - name: IMMICH_WORKERS_EXCLUDE
          value: microservices
        - name: IMMICH_MACHINE_LEARNING_URL
          value: http://immich-ml:3003
        - name: REDIS_HOSTNAME
          value: redis.system
        - name: DB_HOSTNAME
          value: postgres.bgalhardo.internal
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE_NAME
          value: immich
        - name: DB_USERNAME
          value: immich
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-db-password
              key: db_password
        - name: IMMICH_IGNORE_MOUNT_CHECK_ERRORS
          value: "true"
        - name: NODE_EXTRA_CA_CERTS
          value: /certs/ca.crt
        image: ghcr.io/immich-app/immich-server:v3.3.5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 2283
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /api/server/ping
            port: http
          periodSeconds: 10
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/server/ping
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /data
          name: data
          subPath: immich
        - mountPath: /data/thumbs
          name: data
          subPath: immich-cache/thumbs
        - mountPath: /data/encoded-video
          name: data
          subPath: immich-cache/encoded-video
        - mountPath: /external
          name: data
          subPath: archive_public
        - mountPath: /certs
          name: ca
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1536Mi"
            cpu: "1"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: library
      - name: ca
        secret:
          secretName: immich-ca
          items:
          - key: ca
            path: ca.crt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-microservices
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-microservices
  template:
    metadata:
      labels:
        app: immich-microservices
    spec:
      containers:
      - name: immich-microservices
        env:
        - name: IMMICH_WORKERS_INCLUDE
          value: microservices
        - name: IMMICH_MACHINE_LEARNING_URL
          value: http://immich-ml:3003
        - name: REDIS_HOSTNAME
          value: redis.system
        - name: DB_HOSTNAME
          value: postgres.bgalhardo.internal
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE_NAME
          value: immich
        - name: DB_USERNAME
          value: immich
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-db-password
              key: db_password
        - name: IMMICH_IGNORE_MOUNT_CHECK_ERRORS
          value: "true"
        - name: NODE_EXTRA_CA_CERTS
          value: /certs/ca.crt
        image: ghcr.io/immich-app/immich-server:v3.3.5
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /data
          name: data
          subPath: immich
        - mountPath: /data/thumbs
          name: data
          subPath: immich-cache/thumbs
        - mountPath: /data/encoded-video
          name: data
          subPath: immich-cache/encoded-video
        - mountPath: /external
          name: data
          subPath: archive_public
        - mountPath: /certs
          name: ca
        resources:
          requests:
            memory: "768Mi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "2"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: library
      - name: ca
        secret:
          secretName: immich-ca
          items:
          - key: ca
            path: ca.crt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-ml
  template:
    metadata:
      labels:
        app: immich-ml
    spec:
      containers:
      - name: immich-ml
        image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /cache
          name: ml-cache
      volumes:
      - name: ml-cache
        persistentVolumeClaim:
          claimName: immich-ml-cache
---
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-db
  namespace: immich
spec:
  type: kv-v2
  mount: kv
  path: apps/immich
  destination:
    name: immich-db-password
    create: true
  refreshAfter: 30s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-ca
  namespace: immich
spec:
  type: kv-v2
  mount: kv
  path: infra/root-ca
  destination:
    name: immich-ca
    create: true
  refreshAfter: 30s
