apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obsidian

resources:
  - obsidian.yaml

# Always-on tier -> pin to the Apollo worker. Notes must stay reachable when
# hades is asleep
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { homelab/node: apollo }
