apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb
  namespace: system
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb
  namespace: system
data:
  local.ini: |
    [couchdb]
    single_node = true
    max_document_size = 50000000

    [chttpd]
    require_valid_user = true
    require_valid_user_except_for_up = true
    max_http_request_size = 4294967296
    enable_cors = true

    [chttpd_auth]
    require_valid_user = true
    authentication_redirect = /_utils/session.html

    [httpd]
    WWW-Authenticate = Basic realm="couchdb"
    enable_cors = true

    [cors]
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    credentials = true
    headers = accept, authorization, content-type, origin, referer
    methods = GET,PUT,POST,HEAD,DELETE
    max_age = 3600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      securityContext:
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
      containers:
      - name: couchdb
        image: couchdb:3.4.2
        env:
        - name: COUCHDB_USER
          valueFrom:
            secretKeyRef:
              name: couchdb
              key: username
        - name: COUCHDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: couchdb
              key: password
        volumeMounts:
        - name: data
          mountPath: /opt/couchdb/data
        - name: config
          mountPath: /opt/couchdb/etc/local.d/local.ini
          subPath: local.ini
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: couchdb
      - name: config
        configMap:
          name: couchdb
---
apiVersion: v1
kind: Service
metadata:
  name: couchdb
  namespace: system
spec:
  selector:
    app: couchdb
  ports:
    - name: http
      port: 5984
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: couchdb
  namespace: system
spec:
  hostnames:
  - couchdb.bgalhardo.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: system
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: couchdb
      port: 5984
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: couchdb
  namespace: system
spec:
  type: kv-v2
  mount: kv
  path: apps/couchdb
  destination:
    name: couchdb
    create: true
  refreshAfter: 30s
