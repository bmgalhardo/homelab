apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system

resources:
  - cloudflare-ddns.yaml
  - couchdb.yaml
  - homepage.yaml
  - pgadmin.yaml
  - redis.yaml

# always-on tier -> pin to the Apollo worker
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { homelab/node: apollo }
  - target: { kind: StatefulSet }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { homelab/node: apollo }
