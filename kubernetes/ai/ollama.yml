apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                until ollama list >/dev/null 2>&1; do sleep 2; done
                ollama pull llama3.2:1b
                ollama pull nomic-embed-text
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-models
      volumes:
      - name: ollama-models
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
