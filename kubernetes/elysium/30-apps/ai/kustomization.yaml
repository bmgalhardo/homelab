apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

resources:
  - namespace.yml
  - llama-cpp.yml
  - llama-cpp-gpu.yml
  - litellm.yml
  - openwebui.yml
  - facefusion.yml
  - postgres-ca.yaml

patches:
  - target: { kind: Deployment, name: llama-cpp|openwebui|litellm|facefusion }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { homelab/node: hades }
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute }
          - { key: node.kubernetes.io/not-ready,  operator: Exists, effect: NoExecute }
  - target: { kind: Deployment, name: llama-cpp-gpu }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { homelab/gpu: nvidia }
