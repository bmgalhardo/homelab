apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-dump
  namespace: forgejo
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
          - name: dump
            image: codeberg.org/forgejo/forgejo:17.0.1-rootless
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            command:
            - sh
            - -c
            - >-
              mkdir -p /var/lib/gitea/backups &&
              forgejo dump --config /var/lib/gitea/custom/conf/app.ini --type tar.gz
              --tempdir /var/lib/gitea/tmp
              --file /var/lib/gitea/backups/forgejo-dump-$(date +%Y%m%d).tar.gz &&
              find /var/lib/gitea/backups -name 'forgejo-dump-*.tar.gz' -mtime +3 -delete
            env:
            - name: SSL_CERT_DIR
              value: /certs
            volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
              subPath: data
            - name: data
              mountPath: /etc/gitea
              subPath: config
            - name: ca
              mountPath: /certs
              readOnly: true
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: forgejo-data
          - name: ca
            secret:
              secretName: forgejo-ca
              items:
              - key: ca
                path: ca.crt
