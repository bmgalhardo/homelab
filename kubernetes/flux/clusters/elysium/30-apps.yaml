apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 30-apps
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: 20-infra-wiring
  path: ./kubernetes/30-apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
