apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - sources.yaml
  - metallb.yaml
  - cert-manager.yaml
  - cloudnative-pg.yaml
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml

patches:
  - path: local-path-config.yaml
    target:
      kind: ConfigMap
      name: local-path-config
  # helper pods mount hostPath; Talos enforces `baseline` Pod Security
  - target:
      kind: Namespace
      name: local-path-storage
    patch: |
      - op: add
        path: /metadata/labels
        value: { pod-security.kubernetes.io/enforce: privileged }
  - target:
      kind: StorageClass
      name: local-path
    patch: |
      - op: add
        path: /metadata/annotations
        value: { storageclass.kubernetes.io/is-default-class: "true" }
      - op: add
        path: /allowVolumeExpansion
        value: true
