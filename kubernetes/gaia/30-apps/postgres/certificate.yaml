apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-server
  namespace: postgres
spec:
  secretName: pg-server
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  issuerRef:
    kind: Issuer
    name: vault
  commonName: postgres.bgalhardo.internal
  dnsNames:
    - postgres.bgalhardo.internal
  privateKey:
    algorithm: RSA
    size: 2048
