apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-server
  namespace: postgres
spec:
  secretName: pg-server
  issuerRef:
    kind: Issuer
    name: vault
  commonName: postgres.bgalhardo.internal
  dnsNames:
    - postgres.bgalhardo.internal
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
