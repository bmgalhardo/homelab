apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: postgres
spec:
  instances: 1
  enableSuperuserAccess: true
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.6-0.5.3

  postgresql:
    shared_preload_libraries: ["vchord.so"]
    parameters:
      max_connections: "100"
      shared_buffers: 128MB

  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        superuser: true
        createdb: true
        createrole: true
        bypassrls: true
        inherit: true

  certificates:
    serverTLSSecret: pg-server
    serverCASecret: pg-server

  storage:
    size: 15Gi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
