apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - issuer-vault.yaml
  - certificate.yaml
  - cluster.yaml
  - service-lb.yaml

secretGenerator:
  - name: root-ca
    namespace: postgres
    files:
      - ca.crt=../../../../infra/ca/root-ca.crt
    options:
      disableNameSuffixHash: true
