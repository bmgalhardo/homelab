apiVersion: v1
kind: Service
metadata:
  name: pg-lb
  namespace: postgres
  annotations:
    metallb.io/address-pool: core
    metallb.io/loadBalancerIPs: 192.168.1.177
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: pg
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
