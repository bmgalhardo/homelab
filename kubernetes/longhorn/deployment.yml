apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
spec:
  hostnames:
  - longhorn.bgalhardo.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    sectionName: https
    namespace: system
  rules:
  - backendRefs:
    - name: longhorn-frontend
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: longhorn-minio
spec:
  type: kv-v2
  mount: kv
  path: hal9000/longhorn-minio
  destination:
    name: minio-secret
    create: true
  refreshAfter: 30s
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: bi-weekly-backup
spec:
  cron: "0 0 */3 * *"
  task: "backup"
  groups:
  - default
  retain: 5
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
spec:
  cron: "0 0 * * *"
  task: "snapshot"
  groups:
  - default
  retain: 5
  concurrency: 2

