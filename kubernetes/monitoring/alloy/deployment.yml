apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy
  namespace: monitoring
spec:
  hostnames:
  - alloy.bgalhardo.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: local
    namespace: system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: alloy
      port: 12345
---
apiVersion: v1
kind: Service
metadata:
  name: alloy-loki-proxy
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/name: alloy
  ports:
  - name: talos-logs
    port: 513
  - name: unifi-logs
    protocol: UDP
    port: 514
  type: LoadBalancer
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alloy-homeassistant
  namespace: monitoring
spec:
  type: kv-v2
  mount: kv
  path: hal9000/alloy-homeassistant
  destination:
    name: alloy-homeassistant
    create: true
  refreshAfter: 30s
