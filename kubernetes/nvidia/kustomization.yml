apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yml
- runtimeclass.yml

helmCharts:
- name: nvidia-device-plugin
  releaseName: nvidia-device-plugin
  repo: https://nvidia.github.io/k8s-device-plugin
#  version: 0.13.0
  version: 0.14.3
  valuesFile: values.yml
  namespace: nvidia-system
