apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault
spec:
  vault:
    server: https://vault.bgalhardo.internal
    caBundleSecretRef:
      name: vault-ca
      key: ca  
    path: pki_cert_manager/sign/internal
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: issuer
        serviceAccountRef:
          name: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-token-creator
  namespace: system
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-cert-manager-to-create-tokens
  namespace: system
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
roleRef:
  kind: Role
  name: cert-manager-vault-token-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-ca
  namespace: system
spec:
  type: kv-v2
  mount: kv
  path: hal9000/ca
  destination:
    name: vault-ca
    create: true
  refreshAfter: 30s
