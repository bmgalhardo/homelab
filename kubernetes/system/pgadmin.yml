apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: system
spec:
  selector:
    matchLabels:
      app: pgadmin
  replicas: 1
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:latest
        imagePullPolicy: Always
        env:
        - name: PGADMIN_CONFIG_AUTHENTICATION_SOURCES
          value: "['oauth2']"
        - name: PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER
          value: "True"
        - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
          value: "False"
        - name: PGADMIN_DEFAULT_EMAIL
          value: "dummy@example.com"
        - name: PGADMIN_DEFAULT_PASSWORD
          value: "DUMMY_DO_NOT_USE"
        - name: PGADMIN_CONFIG_OAUTH2_CONFIG
          valueFrom:
            secretKeyRef:
              name: pgadmin-oidc
              key: oidc
        - name: REQUESTS_CA_BUNDLE
          value: "/etc/ssl/certs/ca.crt"
        volumeMounts:
        - mountPath: /pgadmin4/servers.json
          name: servers
          subPath: servers.json
        - mountPath: /etc/ssl/certs
          name: ca
      volumes:
      - name: servers
        configMap:
          name: servers
      - name: ca
        secret:
          secretName: pgadmin-ca
          items:
          - key: ca
            path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: system
spec:
  selector:
    app: pgadmin
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin
  namespace: system
spec:
  hostnames:
  - pgadmin.bgalhardo.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    sectionName: https
    namespace: system
  rules:
  - backendRefs:
    - name: pgadmin
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: servers
  namespace: system
data:
  servers.json: |
    {
        "Servers": {
            "1": {
                "Name": "homelab",
                "Group": "Servers",
                "Host": "192.168.1.177",
                "Port": 5432,
                "MaintenanceDB": "postgres",
                "Username": "postgres",
                "SSLMode": "disable",
                "Shared": true,
                "SharedUsername": "postgres"
            }
        }
    }
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgadmin-oidc
  namespace: system
spec:
  type: kv-v2
  mount: kv
  path: hal9000/pgadmin-oidc
  destination:
    name: pgadmin-oidc
    create: true
  refreshAfter: 30s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgamin-ca
  namespace: system
spec:
  type: kv-v2
  mount: kv
  path: hal9000/ca
  destination:
    name: pgadmin-ca
    create: true
  refreshAfter: 30s
