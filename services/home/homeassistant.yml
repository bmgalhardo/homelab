apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: home
spec:
  selector:
    app: homeassistant
  ports:
  - name: http
    port: 8123
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homeassistant
  namespace: home
spec:
  serviceName: homeassistant
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      containers:
      - env:
        - name: TZ
          value: Europe/Lisbon
        image: ghcr.io/home-assistant/home-assistant:stable
        imagePullPolicy: Always
        name: homeassistant
        volumeMounts:
        - mountPath: /config
          name: data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 5Gi
