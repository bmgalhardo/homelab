apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: minio-shiva
  namespace: system
  labels:
    kubernetes.io/service-name: minio-shiva
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.174
ports:
  - name: console
    port: 9001
  - name: api
    port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio-shiva
  namespace: system
spec:
  ports:
    - name: console
      port: 9001
    - name: api
      port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-shiva
  namespace: system
spec:
  hostnames:
  - shiva.bgalhardo.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: local
    namespace: system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /ui/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: minio-shiva
      port: 9001
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: minio-shiva
      port: 9000
