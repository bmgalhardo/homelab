apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: netboot
  namespace: system
  labels:
    kubernetes.io/service-name: netboot
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.172
ports:
  - name: http
    port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: netboot
  namespace: system
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netboot
  namespace: system
spec:
  hostnames:
  - netboot.bgalhardo.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: local
    namespace: system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: netboot
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
