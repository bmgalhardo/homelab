apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox
  namespace: system
  labels:
    kubernetes.io/service-name: proxmox
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.197
    conditions:
      ready: true
  - addresses:
      - 192.168.1.198
    conditions:
      ready: false
ports:
  - name: https
    port: 8006
---
apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: system
spec:
  ports:
    - name: https
      port: 8006
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: proxmox
  namespace: system
spec:
  hostnames:
  - proxmox.bgalhardo.tls.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: local-passthrough
    namespace: system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: proxmox
      port: 8006
